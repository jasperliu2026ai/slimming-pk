name: Test and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slimming-pk-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: slimming_pk_test
          MYSQL_USER: slimming_pk
          MYSQL_PASSWORD: slimming_pk_ci
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      LOG_LEVEL: fatal
      DATABASE_URL: mysql://slimming_pk:slimming_pk_ci@127.0.0.1:3306/slimming_pk_test
      JWT_SECRET: github-actions-test-secret-only
      WECHAT_APPID: ''
      WECHAT_APPSECRET: ''
      COS_SECRET_ID: ''
      COS_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:deploy
      - run: pnpm build
      - run: pnpm lint
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pnpm exec jest --runInBand 2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          set -e

          if (( test_status != 0 )); then
            error_message=$(tail -n 100 test-output.log \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | awk 'BEGIN { ORS="%0A" } { print }')
            printf '::error title=Backend tests failed::%s\n' "$error_message"
            exit "$test_status"
          fi

  deploy:
    needs: test
    if: ${{ vars.AUTO_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy production
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            'cd /root/slimming-pk && bash scripts/deploy-production.sh'
